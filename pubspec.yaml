name: alphabet_green_energy
description: Alphabet Green Energy App
publish_to: 'none'
version: 20.0.0+20

environment:
  sdk: '>=2.19.2 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^8.2.1
  flutter_native_splash: ^2.4.8
  get: 4.6.6
  flutter_otp_text_field: ^1.1.1
  image_picker: ^1.0.2
  path_provider: ^2.0.14
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  dropdown_search: ^5.0.6
  file_picker: ^12.0.0
  firebase_storage: ^13.0.0
  shared_preferences: ^2.1.0
  connectivity_plus: ^7.3.1
  email_validator:
  url_launcher:
  flutter_launcher_icons: ^0.14.4
  firebase_app_check: ^0.4.0
  location: ^10.0.2
  share_plus: ">=13.0.0 <13.3.0"
  archive: ^4.0.2
  http: ^1.2.1
  csv:

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/ag-logo.png"
  min_sdk_android: 22 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/logo/ag-logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/logo/ag-logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/logo/ag-logo.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#f7f6f1"
  color_dark: "#272727"
  image: assets/logo/splash.png
  image_dark: assets/logo/splash.png

  android_12:
    image: assets/logo/splash.png
    icon_background_color: "#f7f6f1"
    image_dark: assets/logo/splash.png
    icon_background_color_dark: "#272727"

  web:
    image: assets/logo/splash.png
    icon_background_color: "#f7f6f1"
    image_dark: assets/logo/splash.png
    icon_background_color_dark: "#272727"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/images/forgot_password/
    - assets/zipData.json