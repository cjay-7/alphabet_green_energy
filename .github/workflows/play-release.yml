name: Bump version and release to Google Play

# Runs whenever a push to master touches pubspec.yaml.
#  1. If the push didn't already change the `version:` line, bump it
#     (patch + 1, build number + 1) and commit that back with [skip release].
#  2. Build a signed app bundle and upload it as a new release on Play.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64       base64 of android/app/keystore/upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD     storePassword from android/key.properties
#   ANDROID_KEY_PASSWORD          keyPassword
#   ANDROID_KEY_ALIAS             keyAlias
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_SERVICE_ACCOUNT             ag-play-release@<project-id>.iam.gserviceaccount.com
# (Keyless: GitHub signs in to Google with Workload Identity Federation, so no
#  service account key file is stored anywhere.)

on:
  push:
    branches: [master]
    paths: [pubspec.yaml]
  # Manual "Run workflow" button: always bumps, from the latest master.
  workflow_dispatch:
    inputs:
      bump:
        description: Bump the version before releasing
        type: boolean
        default: true

# One release at a time; never cancel one mid-upload.
concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # lets the job request a GitHub OIDC token for Google sign-in

jobs:
  release:
    # Skip the commit this workflow creates itself, so it can't loop.
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Bump version unless this push already changed it
        id: version
        run: |
          current=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          previous=$(git show HEAD~1:pubspec.yaml 2>/dev/null | grep -E '^version:' | awk '{print $2}' || true)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.bump }}" = "false" ]; then
            echo "Manual run with bump disabled; keeping $current."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$current" != "$previous" ]; then
            echo "Version already changed in this push ($previous -> $current); not bumping."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            name=${current%%+*}
            build=${current##*+}
            major=$(echo "$name" | cut -d. -f1)
            minor=$(echo "$name" | cut -d. -f2)
            patch=$(echo "$name" | cut -d. -f3)
            new="$major.$minor.$((patch + 1))+$((build + 1))"
            sed -i "s/^version: .*/version: $new/" pubspec.yaml
            current=$new
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$current" >> "$GITHUB_OUTPUT"

      - name: Commit the bump
        if: steps.version.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "Bump version to ${{ steps.version.outputs.version }} [skip release]"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore/upload-keystore.jks
          EOF

      - run: flutter pub get

      - name: Build signed app bundle
        run: flutter build appbundle --release

      - name: Sign in to Google (keyless)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      # Diagnostic: asks the Play API for an edit directly so a failure shows
      # Google's real error message instead of the upload action's generic one.
      - name: Check Play API access
        continue-on-error: true
        run: |
          curl -s -w '\nHTTP %{http_code}\n' -X POST \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: application/json" -d '{}' \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.alphabet_greens/edits"

      # Picks up the credentials the step above exports via
      # GOOGLE_APPLICATION_CREDENTIALS.
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          packageName: com.alphabet_greens
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
